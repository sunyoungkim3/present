<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>롤링페이퍼 QR 코드</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
    }
    .qr-card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    .qr-card h2 {
      font-size: 22px;
      color: #333;
      margin-bottom: 8px;
    }
    .qr-card p {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }
    #qrcode {
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-url {
      font-size: 13px;
      color: #555;
      background: #f9f9f9;
      padding: 10px 16px;
      border-radius: 10px;
      word-break: break-all;
      margin-bottom: 24px;
    }
    .save-btn {
      padding: 12px 36px;
      border-radius: 12px;
      background: #FEE500;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #3C1E1E;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .save-btn:hover {
      background: #FFD600;
    }
    @media print {
      body { background: #fff; }
      .save-btn { display: none; }
      .qr-card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="qr-card">
    <h2>💌 To. 박세민 선생님</h2>
    <p>QR 코드를 스캔하면 롤링페이퍼를 다운로드할 수 있어요</p>
    <div id="qrcode"></div>
    <div class="qr-url">https://sunyoungkim3.github.io/present/download.html</div>
    <button class="save-btn" onclick="saveQR()">📥 이미지로 저장</button>
  </div>

  <script>
    const pageUrl = 'https://sunyoungkim3.github.io/present/download.html';
    new QRCode(document.getElementById('qrcode'), {
      text: pageUrl,
      width: 256,
      height: 256,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    function saveQR() {
      const canvas = document.querySelector('#qrcode canvas');
      if (canvas) {
        const link = document.createElement('a');
        link.download = 'rolling-paper-qr.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        const img = document.querySelector('#qrcode img');
        if (img) {
          const link = document.createElement('a');
          link.download = 'rolling-paper-qr.png';
          link.href = img.src;
          link.click();
        }
      }
    }
  </script>
</body>
</html>
