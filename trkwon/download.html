<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 롤링페이퍼 다운로드</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #B2C7D9, #8FA8C0);
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      max-width: 360px;
      width: 90%;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h2 { font-size: 20px; color: #333; margin-bottom: 8px; }
    p { font-size: 14px; color: #777; margin-bottom: 24px; line-height: 1.6; }
    .download-btn {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 14px;
      background: #FEE500;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #3C1E1E;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .download-btn:hover {
      background: #FFD600;
      transform: scale(1.03);
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #999;
    }
    .tip {
      margin-top: 24px;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 12px;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
      text-align: left;
    }
    .tip strong { color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💌</div>
    <h2>샛별반 롤링페이퍼</h2>
    <p>권슬기 선생님을 위한<br>마음이 담긴 롤링페이퍼예요</p>
    
    <a class="download-btn" id="downloadBtn" href="rolling-paper-download.html" download="샛별반-롤링페이퍼.html">
      📥 롤링페이퍼 다운로드
    </a>
    
    <div class="status" id="status"></div>
    
    <div class="tip">
      <strong>📱 열기 방법:</strong><br>
      1. 위 버튼을 눌러 다운로드<br>
      2. 다운로드된 파일을 탭하여 열기<br>
      3. 브라우저로 열기 선택
    </div>
  </div>

  <script>
    document.getElementById('downloadBtn').addEventListener('click', () => {
      document.getElementById('status').textContent = '✅ 다운로드가 시작되었습니다!';
    });
  </script>
</body>
</html>
